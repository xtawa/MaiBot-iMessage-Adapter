name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q plugin.py config.py debug.py protocol.py tests

      - name: Test Python bridge protocol
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: sidecar
        run: npm ci

      - name: Build sidecar with locked compiler
        working-directory: sidecar
        run: npm run build

      - name: Test sidecar bridge protocol
        working-directory: sidecar
        run: node --test test/*.test.mjs

      - name: Typecheck with Spectrum-supported TypeScript 6
        working-directory: sidecar
        run: npx --yes -p typescript@6.0.3 tsc -p tsconfig.json --noEmit
